<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
        
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
     
</head>

<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center  vh-100">
        <div class="card p-4 shadow-lg" style="width:450px">
            <h3 class="text-center mb-4">Inicio Sesión</h3>
            <form method="POST" class="justify-content-center">
                <div class="mb-3 row">
                    <label for="staticEmail" class="col-sm-3 col-form-label bg-light">Email</label>
                    <div class="col-sm-9">
                        <input type="text" class="form-control" id="username" placeholder="Nombre Usuario">
                    </div>
                </div>
                <div class="mb-3 row">
                    <label for="inputPassword" class="col-sm-3 col-form-label bg-light">Password</label>
                    <div class="col-sm-9">
                        <input type="password" class="form-control" id="inputPassword" placeholder="Contraseña">
                    </div>
                </div>
                <a  href="./main.html"><button type="submit" class="btn btn-primary w-100">Submit</button></a>
            </form>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
</body>

</html>
